<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew Board</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; background: #F7F4EC; background-image: linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px); background-size: 28px 28px; }
    .cb-input, .cb-textarea {
      font-family: 'Inter', sans-serif; font-size: 14px;
      border: 1px solid #C9C2AC; background: #FFFEFA; color: #1B2A33;
      border-radius: 3px; padding: 10px 12px; width: 100%; -webkit-appearance: none;
    }
    .cb-input:focus, .cb-textarea:focus { outline: 2px solid #1F4E78; outline-offset: 1px; }
    .cb-btn {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      border-radius: 3px; border: 1px solid #1B2A33; background: #1B2A33;
      color: #F7F4EC; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn:hover { background: #2A3F4C; }
    .cb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cb-btn-ghost {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      background: transparent; color: #1B2A33; border: 1px solid #B9B3A0;
      border-radius: 3px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn-ghost:hover { background: #EDE9DC; }
    .cb-btn-danger {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      background: transparent; color: #9A3C3C; border: 1px solid #C98787;
      border-radius: 3px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn-danger:hover { background: #F6E8E8; }
    .cb-btn-danger-solid {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      background: #9A3C3C; color: #fff; border: 1px solid #9A3C3C;
      border-radius: 3px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn-danger-solid:hover { background: #7A3030; }
    .cb-btn-danger-solid:disabled { opacity: 0.4; cursor: not-allowed; }
    .cb-btn-approve {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
      background: #3E6F5C; color: #fff; border: 1px solid #3E6F5C;
      border-radius: 3px; padding: 8px 14px; cursor: pointer;
    }
    .cb-btn-approve:hover { background: #2E5243; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(27,42,51,0.55);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 100; padding: 16px; overflow-y: auto;
    }
    .modal-box {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-radius: 6px;
      padding: 24px; width: 100%; max-width: 480px; margin: auto;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1B2A33; color: #F7F4EC; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; padding: 10px 18px; border-radius: 4px; z-index: 200;
      max-width: 90vw; text-align: center; animation: fadeIn 0.2s ease;
    }
    .toast.error { background: #7A3B3B; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .roster-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-radius: 3px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    @media (min-width: 700px) {
      .roster-card { display: grid; grid-template-columns: 1.3fr 1.4fr auto auto; gap: 16px; align-items: center; }
      .roster-card.plain { grid-template-columns: 1.3fr 1.4fr; }
    }
    .card-actions { display: flex; gap: 8px; }
    .card-actions button { flex: 1; }
    @media (min-width: 700px) { .card-actions button { flex: unset; } }
    .form-row-2 { display: grid; grid-template-columns: 1fr; gap: 13px; }
    @media (min-width: 480px) { .form-row-2 { grid-template-columns: 1fr 1fr; } }
    .search-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .search-bar input { flex: 1; min-width: 160px; }
    .board-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 16px; gap: 12px;
    }
    .req-row {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #C9821F;
      padding: 12px 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .req-row:hover { background: #FDF6EC; }
    .req-detail {
      border: 1px solid #D8D2BF; border-top: none; border-left: 4px solid #C9821F;
      border-radius: 0 0 3px 3px; background: #FFFEFA; padding: 14px 16px;
    }
    .section-title {
      font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px;
      text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
    }
    .edited-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      color: #A4621A; background: #F6E9D6; border: 1px solid #C9821F;
      border-radius: 3px; padding: 2px 7px;
    }
    .tab-strip { display: flex; gap: 2px; border-bottom: 2px solid #1B2A33; margin-bottom: 20px; }
    .tab-btn {
      font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: transparent; border: 1px solid transparent; border-bottom: none;
      color: #8A8270; padding: 10px 20px; cursor: pointer; border-radius: 3px 3px 0 0;
      margin-bottom: -2px;
    }
    .tab-btn:hover { color: #1B2A33; background: #EDE9DC; }
    .tab-btn.active { background: #1B2A33; color: #F7F4EC; border-color: #1B2A33; }
    .mp-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #1F4E78;
      border-radius: 3px; margin-bottom: 10px;
    }
    .mp-card.done { border-left-color: #9A9381; opacity: 0.85; }
    .mp-card-head {
      padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; cursor: pointer; flex-wrap: wrap;
    }
    .mp-card-head:hover { background: #FBF9F2; }
    .mp-card-body { border-top: 1px solid #E3DFD1; padding: 14px 16px; }
    .mp-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mp-grid th {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.06em; color: #8A8270; text-align: right; padding: 0 6px 7px;
      white-space: nowrap;
    }
    .mp-grid th:first-child { text-align: left; }
    .mp-grid td { padding: 4px 6px; border-top: 1px solid #EDE9DC; text-align: right; white-space: nowrap; }
    .mp-grid td:first-child { text-align: left; color: #5A5444; white-space: normal; }
    .mp-grid tr.total-row td { border-top: 2px solid #D8D2BF; font-weight: 600; color: #1B2A33; }
    .mp-num {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; width: 62px;
      border: 1px solid #C9C2AC; background: #FFFEFA; color: #1B2A33;
      border-radius: 3px; padding: 6px 8px; text-align: right; -webkit-appearance: none;
    }
    .mp-num:focus { outline: 2px solid #1F4E78; outline-offset: 1px; }
    .mp-num:disabled { background: #F2EFE4; color: #8A8270; }
    .mp-readonly { font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 8px; display: inline-block; }
    .trade-x {
      background: none; border: none; cursor: pointer; color: #B9B3A0;
      font-size: 14px; line-height: 1; padding: 0 0 0 6px;
    }
    .trade-x:hover { color: #9A3C3C; }
    .roll-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #FFFEFA; }
    .roll-table th {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      color: #8A8270; text-align: right; padding: 9px 10px; border-bottom: 1px solid #D8D2BF;
      white-space: nowrap;
    }
    .roll-table th:first-child { text-align: left; }
    .roll-table td { padding: 9px 10px; border-bottom: 1px solid #EDE9DC; text-align: right; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
    .roll-table td:first-child { text-align: left; font-family: 'Inter', sans-serif; }
    .pill-up { color: #9A3C3C; background: #F6E8E8; border: 1px solid #C98787; border-radius: 3px; padding: 1px 6px; font-size: 11px; }
    .pill-down { color: #3E6F5C; background: #E4EEE7; border: 1px solid #8DB3A2; border-radius: 3px; padding: 1px 6px; font-size: 11px; }
    .move-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #3E6F5C;
      border-radius: 3px; padding: 12px 16px; margin-bottom: 8px; font-size: 13px;
    }
    .move-card.hire { border-left-color: #C9821F; }
    .move-card.avail { border-left-color: #1F4E78; }
    .trade-toggle {
      font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
      padding: 5px 12px; border-radius: 99px; cursor: pointer;
    }
    .comment {
      border-top: 1px solid #EDE9DC; padding: 9px 0;
      display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
    }
    .comment-meta {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.04em; color: #9A9381; margin-bottom: 3px;
    }
    .status-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      border-radius: 3px; padding: 2px 7px; border: 1px solid;
    }
    .danger-box {
      font-size: 12px; color: #9A3C3C; background: #F6E8E8; border: 1px solid #C98787;
      border-radius: 3px; padding: 10px 12px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    const SUPABASE_URL = "https://omlgxlecijdvczbnteai.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tbGd4bGVjaWpkdmN6Ym50ZWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDk1NjMsImV4cCI6MjA5ODQyNTU2M30.SODHGjbOaixxfdLIdDMMqSxkdI3GgjK8Tlrz9d8zU6I";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Role sets, kept in one place so the UI and the RLS policies agree.
    const MANAGER_ROLES = ["admin", "owner", "hidden_admin", "hidden_owner"];
    const isManagerRole = (r) => MANAGER_ROLES.indexOf(r) >= 0;
    const isOwnerRole   = (r) => r === "owner" || r === "hidden_owner";
    const isVisitorRole = (r) => r === "visitor" || r === "hidden_visitor";

    const OWNER_EMAIL = "goldytraju@gmail.com";

    // NOTE: this is a stub. Browser-side code cannot send mail. Wiring this up
    // requires a Supabase Edge Function with a mail provider key.
    async function sendEmail(to, subject, html) {
      console.log("Email notification (not sent — server-side function needed):", { to, subject });
    }

    const clone = (o) => JSON.parse(JSON.stringify(o));
    const numOf = (v) => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
    const digitsOnly = (v) => v === "" || /^\d{0,5}$/.test(v);

    // ── Dates ─────────────────────────────────────────────────────────────────

    function isoDate(d) {
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function endOfMonth(year, monthIndex) { return new Date(year, monthIndex + 1, 0); }
    function monthLabel(d) { return d.toLocaleDateString("en-CA", { month: "long" }); }

    // Six forecast months plus today. When fewer than 7 days remain in the
    // current month the window rolls forward, so nobody is asked to forecast
    // two days out.
    const FORECAST_MONTHS = 6;
    const ROLLOVER_DAYS = 7;

    function computePeriods(today = new Date()) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const thisMonthEnd = endOfMonth(t.getFullYear(), t.getMonth());
      const shift = Math.round((thisMonthEnd - t) / 86400000) < ROLLOVER_DAYS ? 1 : 0;
      const out = [{ key: "now", date: null, label: "On site now", short: "NOW" }];
      for (let i = 0; i < FORECAST_MONTHS; i++) {
        const d = endOfMonth(t.getFullYear(), t.getMonth() + shift + i);
        out.push({
          key: isoDate(d), date: isoDate(d),
          label: "End of " + monthLabel(d),
          short: monthLabel(d).slice(0, 3).toUpperCase() + " " + String(d.getFullYear()).slice(2),
        });
      }
      return out;
    }

    // Every lookup goes through this. Postgres dates arrive as "YYYY-MM-DD",
    // but a timestamp or padded value would break naive string equality and
    // silently zero out the board.
    const periodKeyOf = (row) => row.period_date ? String(row.period_date).slice(0, 10) : "now";

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      return Math.round((new Date(dateStr + "T00:00:00") - today) / 86400000);
    }
    function daysSince(tsStr) {
      if (!tsStr) return null;
      return Math.floor((new Date() - new Date(tsStr)) / 86400000);
    }

    function deriveStatus(p) {
      const onVacation = p.vacation_start && p.vacation_end &&
        new Date() >= new Date(p.vacation_start + "T00:00:00") &&
        new Date() <= new Date(p.vacation_end + "T23:59:59");
      if (onVacation) return "vacation";
      if (!p.current_project || p.current_project.toLowerCase() === "unassigned") return "available";
      const du = daysUntil(p.project_end);
      if (du !== null && du <= 14) return "transitioning";
      return "active";
    }

    const STATUS_META = {
      active:        { label: "On project",  stamp: "ACTIVE",     color: "#3E6F5C", bg: "#E4EEE7", border: "#3E6F5C" },
      transitioning: { label: "Wrapping up", stamp: "TRANSITION", color: "#A4621A", bg: "#F6E9D6", border: "#C9821F" },
      available:     { label: "Available",   stamp: "AVAILABLE",  color: "#1F4E78", bg: "#E1E9F0", border: "#2E6394" },
      vacation:      { label: "On vacation", stamp: "ON LEAVE",   color: "#7A3B3B", bg: "#F2E1E1", border: "#A14E4E" },
    };

    function fmt(d) {
      if (!d) return "—";
      return new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
    }
    function fmtStamp(ts) {
      if (!ts) return "";
      return new Date(ts).toLocaleString("en-CA", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
    }

    // ── Shared inputs ─────────────────────────────────────────────────────────

    function PasswordField({ label, value, onChange, placeholder, onKeyDown }) {
      const [show, setShow] = React.useState(false);
      const [capsOn, setCapsOn] = React.useState(false);
      return (
        <label style={{ display: "block" }}>
          <div style={{ fontSize: 11, color: "#7A7461", marginBottom: 5, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em" }}>
            {label.toUpperCase()}
          </div>
          <div style={{ position: "relative" }}>
            <input className="cb-input" type={show ? "text" : "password"} value={value} onChange={onChange}
              placeholder={placeholder || "••••••••"} onKeyDown={onKeyDown}
              onKeyUp={e => setCapsOn(e.getModifierState("CapsLock"))}
              onFocus={e => setCapsOn(e.getModifierState("CapsLock"))}
              style={{ paddingRight: 40 }} />
            <button type="button" onClick={() => setShow(!show)} style={{
              position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)",
              background: "none", border: "none", cursor: "pointer", fontSize: 15, color: "#8A8270", padding: 0,
            }}>{show ? "🙈" : "👁"}</button>
          </div>
          {capsOn && <div style={{ fontSize: 11, color: "#A4621A", marginTop: 4 }}>⚠ Caps Lock is on</div>}
        </label>
      );
    }

    function Field({ label, children }) {
      return (
        <label style={{ display: "block" }}>
          <div style={{ fontSize: 11, color: "#7A7461", marginBottom: 5, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em" }}>
            {label.toUpperCase()}
          </div>
          {children}
        </label>
      );
    }

    function Toast({ message, type, onDone }) {
      useEffect(() => { const t = setTimeout(onDone, type === "error" ? 5000 : 2800); return () => clearTimeout(t); }, []);
      return <div className={`toast${type === "error" ? " error" : ""}`}>{message}</div>;
    }

    // Trade lines across the period columns, with a derived Total beneath.
    // Total is never typed — it is the sum of the trade rows, matching what the
    // database trigger writes.
    function ManpowerGrid({ rows, periods, onChange, disabled }) {
      const total = (pKey) => rows.reduce((s, r) => s + numOf(r.values[pKey]), 0);
      return (
        <div style={{ overflowX: "auto" }}>
          <table className="mp-grid">
            <thead>
              <tr>
                <th>Trade</th>
                {periods.map(p => <th key={p.key}>{p.short || (p.label || "").toUpperCase()}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (
                <tr><td colSpan={periods.length + 1} style={{ color: "#8A8270", fontSize: 12, padding: "10px 6px" }}>
                  No trades selected yet.
                </td></tr>
              )}
              {rows.map((row, ri) => (
                <tr key={row.trade_id}>
                  <td>{row.label}</td>
                  {periods.map(p => (
                    <td key={p.key}>
                      <input className="mp-num" inputMode="numeric" disabled={disabled}
                        value={row.values[p.key] === undefined ? "" : String(row.values[p.key])}
                        onChange={e => { if (digitsOnly(e.target.value)) onChange(ri, p.key, e.target.value); }}
                        placeholder="0" />
                    </td>
                  ))}
                </tr>
              ))}
              {rows.length > 0 && (
                <tr className="total-row">
                  <td>Total</td>
                  {periods.map(p => <td key={p.key}><span className="mp-readonly">{total(p.key)}</span></td>)}
                </tr>
              )}
            </tbody>
          </table>
        </div>
      );
    }

    // ── Login ─────────────────────────────────────────────────────────────────
    function LoginScreen({ onSwitchToSignup }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [view, setView] = useState("login");

      async function handleLogin() {
        setLoading(true); setMessage(null);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { setMessage({ text: error.message, type: "error" }); setLoading(false); }
      }

      async function handleForgot() {
        if (!email) { setMessage({ text: "Enter your email address above first.", type: "error" }); return; }
        setLoading(true); setMessage(null);
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: "https://goldytr.github.io/crew-board/" });
        if (error) { setMessage({ text: error.message, type: "error" }); }
        else { setMessage({ text: "Password reset email sent — check your inbox.", type: "ok" }); setView("login"); }
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: "#F7F4EC", backgroundImage: "linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px)", backgroundSize: "28px 28px", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#FFFEFA", border: "1px solid #D8D2BF", borderRadius: 6, padding: 32, width: "100%", maxWidth: 380 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6B6354", marginBottom: 4 }}>REGISTER — CREW DEPLOYMENT</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, textTransform: "uppercase", marginBottom: 24 }}>Crew Board</h1>
            {view === "login" ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <Field label="Email"><input className="cb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" /></Field>
                <PasswordField label="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} />
                {message && <div style={{ fontSize: 12, color: message.type === "ok" ? "#3E6F5C" : "#9A3C3C", background: message.type === "ok" ? "#E4EEE7" : "#F6E8E8", padding: "8px 12px", borderRadius: 3 }}>{message.text}</div>}
                <button className="cb-btn" disabled={!email || !password || loading} onClick={handleLogin}>{loading ? "Signing in…" : "Sign in"}</button>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                  <button onClick={() => { setView("forgot"); setMessage(null); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#6B6354", textDecoration: "underline", fontFamily: "'Inter', sans-serif" }}>Forgot password?</button>
                  <button onClick={onSwitchToSignup} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#1F4E78", textDecoration: "underline", fontFamily: "'Inter', sans-serif", fontWeight: 600 }}>Request access →</button>
                </div>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 13, color: "#5A5444", marginBottom: 4 }}>Enter your email and we will send you a link to reset your password.</div>
                <Field label="Email"><input className="cb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" /></Field>
                {message && <div style={{ fontSize: 12, color: message.type === "ok" ? "#3E6F5C" : "#9A3C3C", background: message.type === "ok" ? "#E4EEE7" : "#F6E8E8", padding: "8px 12px", borderRadius: 3 }}>{message.text}</div>}
                <button className="cb-btn" disabled={!email || loading} onClick={handleForgot}>{loading ? "Sending…" : "Send reset email"}</button>
                <button onClick={() => { setView("login"); setMessage(null); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#6B6354", textDecoration: "underline", fontFamily: "'Inter', sans-serif", textAlign: "center" }}>← Back to sign in</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Sign Up ───────────────────────────────────────────────────────────────
    function SignupScreen({ onSwitchToLogin }) {
      const [firstName, setFirstName] = useState("");
      const [lastName, setLastName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);

      async function handleSignup() {
        if (password !== confirm) { setMessage({ text: "Passwords do not match.", type: "error" }); return; }
        if (password.length < 6) { setMessage({ text: "Password must be at least 6 characters.", type: "error" }); return; }
        if (!firstName.trim() || !lastName.trim()) { setMessage({ text: "Please enter your full name.", type: "error" }); return; }
        setLoading(true); setMessage(null);
        const fullName = `${firstName.trim()} ${lastName.trim()}`;
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { setMessage({ text: error.message, type: "error" }); setLoading(false); return; }
        if (data?.user) {
          const { error: roleErr } = await sb.from("user_roles").insert({
            user_id: data.user.id, email: data.user.email, full_name: fullName,
            role: "member", status: "pending",
          });
          if (roleErr) {
            setMessage({ text: "Account created, but the access request failed to register: " + roleErr.message + " — please contact your manager.", type: "error" });
            setLoading(false); return;
          }
          await sendEmail(OWNER_EMAIL, "New Access Request — Crew Board", `<p><strong>${fullName}</strong> (${email}) has requested access.</p>`);
        }
        setMessage({ text: "Request submitted — an Admin will approve your access shortly.", type: "ok" });
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: "#F7F4EC", backgroundImage: "linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px)", backgroundSize: "28px 28px", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#FFFEFA", border: "1px solid #D8D2BF", borderRadius: 6, padding: 32, width: "100%", maxWidth: 420 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6B6354", marginBottom: 4 }}>REGISTER — CREW DEPLOYMENT</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, textTransform: "uppercase", marginBottom: 6 }}>Request Access</h1>
            <div style={{ fontSize: 13, color: "#6B6354", marginBottom: 20 }}>Fill in your details below. An Admin will review and approve your request.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div className="form-row-2">
                <Field label="First name"><input className="cb-input" value={firstName} onChange={e => setFirstName(e.target.value)} placeholder="John" /></Field>
                <Field label="Last name"><input className="cb-input" value={lastName} onChange={e => setLastName(e.target.value)} placeholder="Smith" /></Field>
              </div>
              <Field label="Email"><input className="cb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" /></Field>
              <PasswordField label="Password" value={password} onChange={e => setPassword(e.target.value)} />
              <PasswordField label="Confirm password" value={confirm} onChange={e => setConfirm(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSignup()} />
              {message && <div style={{ fontSize: 12, color: message.type === "ok" ? "#3E6F5C" : "#9A3C3C", background: message.type === "ok" ? "#E4EEE7" : "#F6E8E8", padding: "10px 12px", borderRadius: 3, lineHeight: 1.5 }}>{message.text}</div>}
              {message?.type !== "ok" ? (
                <React.Fragment>
                  <button className="cb-btn" disabled={!firstName || !lastName || !email || !password || !confirm || loading} onClick={handleSignup}>{loading ? "Submitting…" : "Submit request"}</button>
                  <button onClick={onSwitchToLogin} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#6B6354", textDecoration: "underline", fontFamily: "'Inter', sans-serif", textAlign: "center" }}>← Back to sign in</button>
                </React.Fragment>
              ) : (
                <button className="cb-btn-ghost" onClick={onSwitchToLogin}>← Back to sign in</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── Person Form ───────────────────────────────────────────────────────────
    function PersonForm({ person, onCancel, onSave, saving, isViewer }) {
      const blank = { name: "", position: "", trade: "", current_project: "", project_end: "", next_project: "", vacation_start: "", vacation_end: "", comments: "" };

          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

            <div className="form-row-2">

              <Field label="Vacation end"><input className="cb-input" type="date" value={form.vacation_end || ""} onChange={set("vacation_end")} /></Field>

          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 20 }}>
            <button className="cb-btn-ghost" onClick={onCancel} disabled={saving}>Cancel</button>
            <button className="cb-btn" disabled={!form.name.trim() || saving} onClick={() => form.name.trim() && onSave(form)}>{saving ? "Submitting…" : isViewer ? "Submit request" : "Save entry"}</button>
          </div>
        </div>
      );
    }

    // ── Requests ──────────────────────────────────────────────────────────────
    const FIELD_LABELS = {
      name: "Name", position: "Position", trade: "Trade", current_project: "Current project",
      project_end: "Project end", next_project: "Next project",
      vacation_start: "Vacation start", vacation_end: "Vacation end", comments: "Comments",
    };
    const ROSTER_FIELDS = ["name","position","trade","current_project","project_end","next_project","vacation_start","vacation_end","comments"];
    const DATE_FIELDS = ["project_end", "vacation_start", "vacation_end"];

    function RequestCard({ r, roster, onApprove, onReject }) {
      const [expanded, setExpanded] = useState(false);
      const original = useMemo(() => {
        try { return JSON.parse(r.payload); } catch (e) { return {}; }
      }, [r.payload]);
      const [draft, setDraft] = useState(() => clone(original));
      useEffect(() => { setDraft(clone(original)); }, [original]);

      const kind = r.kind || "roster";
      const current = roster.find(p => p.id === r.roster_id) || {};
      const requesterName = r.requester_full_name || r.requester_email;
      const edited = JSON.stringify(draft) !== JSON.stringify(original);

      const KIND_ICON = { manpower: "📊", project: "🏗", trade: "🔧" };
      const actionIcon = kind === "roster"
        ? (r.action === "add" ? "➕" : r.action === "edit" ? "✏️" : "🗑")
        : KIND_ICON[kind];

      const headline =
        kind === "project"  ? <span>requested a new project <strong>{original.name}</strong></span> :
        kind === "trade"    ? <span>requested a new trade <strong>{original.name}</strong></span> :
        kind === "manpower" ? <span>submitted manpower for <strong>{original.project_name}</strong></span> :
        <span>requested to {r.action === "add" ? "add" : r.action === "edit" ? "edit" : "remove"} <strong>{original.name}</strong></span>;

      const gridRows = Array.isArray(draft.rows) ? draft.rows.filter(x => x.trade_id != null) : [];
      const hasGrid = (kind === "manpower" || kind === "project") && Array.isArray(draft.rows);

      function setGridValue(visibleIndex, periodKey, value) {
        const target = gridRows[visibleIndex];
        setDraft(d => {
          const next = clone(d);
          const row = next.rows.find(x => x.trade_id === target.trade_id);
          if (row) row.values[periodKey] = value === "" ? "" : numOf(value);
          return next;
        });
      }

      return (
        <div>
          <div className="req-row" style={{ borderRadius: expanded ? "3px 3px 0 0" : 3 }} onClick={() => setExpanded(!expanded)}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
              <span style={{ fontSize: 14 }}>{actionIcon}</span>
              <div style={{ fontSize: 13, color: "#1B2A33" }}>
                <strong>{requesterName}</strong>{" "}
                <span style={{ color: "#8A8270" }}>{headline}</span>
              </div>
            </div>
            <span style={{ fontSize: 11, color: "#9A9381", fontFamily: "'JetBrains Mono', monospace", flexShrink: 0 }}>
              {expanded ? "▲ Hide" : "▼ Review"}
            </span>
          </div>

          {expanded && (
            <div className="req-detail">
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>
                <div style={{ fontSize: 12, color: "#7A7461" }}>
                  Requested by <strong>{requesterName}</strong>
                  {r.requester_full_name && <span style={{ fontSize: 11, color: "#9A9381", fontFamily: "'JetBrains Mono', monospace", marginLeft: 8 }}>{r.requester_email}</span>}
                </div>
                {edited && <span className="edited-chip">EDITED BY YOU</span>}
              </div>

              {(kind === "project" || kind === "trade") && (
                <div style={{ marginBottom: 12 }}>
                  <Field label={kind + " name"}>
                    <input className="cb-input" value={draft.name || ""}
                      onChange={e => setDraft(Object.assign({}, draft, { name: e.target.value }))} />
                  </Field>
                  {kind === "project" && (
                    <div className="form-row-2" style={{ marginTop: 12 }}>
                      <Field label="Start date">
                        <input className="cb-input" type="date" value={draft.start_date || ""}
                          onChange={e => setDraft(Object.assign({}, draft, { start_date: e.target.value }))} />
                      </Field>
                      <Field label="End date">
                        <input className="cb-input" type="date" value={draft.end_date || ""}
                          onChange={e => setDraft(Object.assign({}, draft, { end_date: e.target.value }))} />
                      </Field>
                    </div>
                  )}
                  {kind === "project" && hasGrid && (
                    <div style={{ marginTop: 14 }}>
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#8A8270", marginBottom: 8 }}>STARTING MANPOWER</div>
                      <ManpowerGrid rows={gridRows} periods={draft.periods || []} onChange={setGridValue} />
                    </div>
                  )}
                </div>
              )}

              {kind === "manpower" && hasGrid && (
                <div style={{ marginBottom: 12 }}>
                  <ManpowerGrid rows={gridRows} periods={draft.periods || []} onChange={setGridValue} />
                </div>
              )}

              {kind === "roster" && r.action === "remove" && (
                <div className="danger-box" style={{ marginBottom: 12 }}>
                  This will permanently remove <strong>{original.name}</strong> from the board.
                </div>
              )}

              {kind === "roster" && r.action !== "remove" && (
                <div style={{ marginBottom: 12 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "96px 1fr 1fr", gap: 8, marginBottom: 6 }}>
                    <div></div>
                    <div style={{ fontSize: 11, color: "#8A8270", fontFamily: "'JetBrains Mono', monospace" }}>{r.action === "edit" ? "CURRENT" : ""}</div>
                    <div style={{ fontSize: 11, color: "#A4621A", fontFamily: "'JetBrains Mono', monospace" }}>REQUESTED</div>
                  </div>
                  {ROSTER_FIELDS.map(f => {
                    const cur = current[f] || "";
                    const req = draft[f] || "";
                    if (r.action === "edit" && !cur && !req) return null;
                    const changed = r.action === "edit" && (cur || "") !== (req || "");
                    return (
                      <div key={f} style={{ display: "grid", gridTemplateColumns: "96px 1fr 1fr", gap: 8, alignItems: "center", padding: "3px 0" }}>
                        <div style={{ color: "#8A8270", fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }}>{FIELD_LABELS[f]}</div>
                        <div style={{ fontSize: 12, color: "#5A5444" }}>{r.action === "edit" ? (cur || <span style={{ color: "#C9C2AC" }}>—</span>) : null}</div>
                        <input className="cb-input" type={DATE_FIELDS.indexOf(f) >= 0 ? "date" : "text"}
                          style={{ fontSize: 12, padding: "6px 9px", borderColor: changed ? "#C9821F" : "#C9C2AC", background: changed ? "#FDF3E3" : "#FFFEFA" }}
                          value={draft[f] || ""}
                          onChange={e => setDraft(Object.assign({}, draft, { [f]: e.target.value }))} />
                      </div>
                    );
                  })}
                </div>
              )}

              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 8, flexWrap: "wrap" }}>
                {edited && <button className="cb-btn-ghost" style={{ fontSize: 13, padding: "8px 14px" }} onClick={() => setDraft(clone(original))}>Reset changes</button>}
                <button className="cb-btn-approve" onClick={() => onApprove(r, draft)}>{edited ? "Approve with edits" : "Approve"}</button>
                <button className="cb-btn-danger" style={{ padding: "8px 14px", fontSize: 13 }} onClick={() => onReject(r.id, r)}>Reject</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RequestsPanel({ requests, roster, onApprove, onReject }) {
      if (requests.length === 0) return null;
      return (
        <div style={{ marginBottom: 24 }}>
          <div className="section-title">
            Pending Requests
            <span style={{ background: "#C9821F", color: "#fff", borderRadius: 99, fontSize: 11, fontFamily: "'Inter', sans-serif", padding: "2px 8px" }}>{requests.length}</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {requests.map(r => <RequestCard key={r.id} r={r} roster={roster} onApprove={onApprove} onReject={onReject} />)}
          </div>
        </div>
      );
    }

    // ── Charts ────────────────────────────────────────────────────────────────

    function GroupedBars({ series, periods }) {
      const W = 860, H = 200, padL = 46, padB = 34, padT = 14, padR = 10;
      const max = Math.max(1, ...series.reduce((a, r) => a.concat(r.values), []));
      const plotW = W - padL - padR, plotH = H - padB - padT;
      const groupW = plotW / Math.max(1, periods.length);
      const barW = Math.min(34, (groupW - 10) / Math.max(1, series.length));
      const COLORS = ["#1F4E78", "#3E6F5C", "#C9821F", "#7A3B3B", "#5A5444", "#2E6394"];

      return (
        <div style={{ overflowX: "auto" }}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", minWidth: 560, height: "auto", display: "block" }}>
            {[0, 0.5, 1].map(f => {
              const y = padT + plotH - f * plotH;
              return (
                <g key={f}>
                  <line x1={padL} y1={y} x2={W - padR} y2={y} stroke="#E3DFD1" strokeWidth="1" />
                  <text x={padL - 7} y={y + 4} textAnchor="end" fontSize="10" fill="#8A8270" fontFamily="'JetBrains Mono', monospace">{Math.round(max * f)}</text>
                </g>
              );
            })}
            {periods.map((p, pi) => {
              const gx = padL + pi * groupW;
              return (
                <g key={p.key}>
                  {series.map((r, ri) => {
                    const v = r.values[pi];
                    const h = (v / max) * plotH;
                    const x = gx + (groupW - barW * series.length) / 2 + ri * barW;
                    return (
                      <g key={r.name}>
                        <rect x={x} y={padT + plotH - h} width={Math.max(2, barW - 2)} height={h} fill={COLORS[ri % COLORS.length]} />
                        {v > 0 && <text x={x + (barW - 2) / 2} y={padT + plotH - h - 4} textAnchor="middle" fontSize="9" fill="#5A5444" fontFamily="'JetBrains Mono', monospace">{v}</text>}
                      </g>
                    );
                  })}
                  <text x={gx + groupW / 2} y={H - padB + 16} textAnchor="middle" fontSize="9" fill="#5A5444" fontFamily="'JetBrains Mono', monospace">{p.short}</text>
                </g>
              );
            })}
          </svg>
          {series.length > 1 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 6 }}>
              {series.map((r, i) => (
                <div key={r.name} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "#5A5444" }}>
                  <span style={{ width: 10, height: 10, background: COLORS[i % COLORS.length], borderRadius: 2 }} />
                  {r.name}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ProjectTrendChart({ actuals, forecast, periods }) {
      const hist = actuals.slice().sort((a, b) => String(a.recorded_on).localeCompare(String(b.recorded_on)));
      const points = hist.map(a => ({ label: String(a.recorded_on).slice(0, 10), value: a.headcount, actual: true }));
      periods.slice(1).forEach(p => points.push({ label: p.date, value: forecast[p.key] || 0, actual: false }));

      if (points.length < 2) {
        return <div style={{ fontSize: 12, color: "#8A8270", padding: "6px 0" }}>
          Not enough history yet — the curve appears once this project has been updated on more than one day.
        </div>;
      }

      const W = 720, H = 150, padL = 36, padB = 26, padT = 12, padR = 10;
      const plotW = W - padL - padR, plotH = H - padB - padT;
      const max = Math.max(1, ...points.map(p => p.value));
      const xAt = i => padL + (i / (points.length - 1)) * plotW;
      const yAt = v => padT + plotH - (v / max) * plotH;
      const lastActual = points.filter(p => p.actual).length - 1;
      const solid = points.slice(0, lastActual + 1).map((p, i) => `${xAt(i)},${yAt(p.value)}`).join(" ");
      const from = Math.max(0, lastActual);
      const dashed = points.slice(from).map((p, i) => `${xAt(i + from)},${yAt(p.value)}`).join(" ");

      return (
        <div style={{ overflowX: "auto" }}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", minWidth: 420, height: "auto", display: "block" }}>
            {[0, 0.5, 1].map(f => {
              const y = padT + plotH - f * plotH;
              return (
                <g key={f}>
                  <line x1={padL} y1={y} x2={W - padR} y2={y} stroke="#EDE9DC" strokeWidth="1" />
                  <text x={padL - 6} y={y + 4} textAnchor="end" fontSize="9" fill="#9A9381" fontFamily="'JetBrains Mono', monospace">{Math.round(max * f)}</text>
                </g>
              );
            })}
            {lastActual >= 1 && <polyline points={solid} fill="none" stroke="#1F4E78" strokeWidth="2" />}
            <polyline points={dashed} fill="none" stroke="#C9821F" strokeWidth="2" strokeDasharray="5 4" />
            {points.map((p, i) => <circle key={i} cx={xAt(i)} cy={yAt(p.value)} r="3" fill={p.actual ? "#1F4E78" : "#C9821F"} />)}
            <text x={padL} y={H - 8} fontSize="9" fill="#9A9381" fontFamily="'JetBrains Mono', monospace">{points[0].label}</text>
            <text x={W - padR} y={H - 8} textAnchor="end" fontSize="9" fill="#9A9381" fontFamily="'JetBrains Mono', monospace">{points[points.length - 1].label}</text>
          </svg>
          <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#5A5444", marginTop: 2 }}>
            <span><span style={{ display: "inline-block", width: 14, height: 2, background: "#1F4E78", verticalAlign: "middle", marginRight: 5 }} />Actual</span>
            <span><span style={{ display: "inline-block", width: 14, height: 2, background: "#C9821F", verticalAlign: "middle", marginRight: 5 }} />Forecast</span>
          </div>
        </div>
      );
    }

    // ── Manpower: visitor ─────────────────────────────────────────────────────

    function VisitorManpower() {
      const [trades, setTrades] = useState([]);
      const [summary, setSummary] = useState([]);
      const [loading, setLoading] = useState(true);
      const periods = useMemo(() => computePeriods(), []);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          const [tRes, sRes] = await Promise.all([
            sb.from("trades").select("id, name").eq("status", "approved").order("name"),
            sb.from("manpower_summary").select("*"),
          ]);
          if (cancelled) return;
          setTrades(tRes.data || []);
          setSummary(sRes.data || []);
          setLoading(false);
        })();
        return () => { cancelled = true; };
      }, []);

      const at = (tradeId, periodKey) => {
        const row = summary.find(s =>
          (s.trade_id == null ? null : s.trade_id) === (tradeId == null ? null : tradeId) &&
          periodKeyOf(s) === periodKey);
        return row ? row.headcount : 0;
      };

      const totals = periods.map(p => at(null, p.key));
      const activeTrades = trades.filter(t => periods.some(p => at(t.id, p.key) > 0));
      const series = activeTrades.map(t => ({ name: t.name, values: periods.map(p => at(t.id, p.key)) }));

      if (loading) return (
        <div style={{ border: "1px dashed #C9C2AC", borderRadius: 4, padding: 48, textAlign: "center", color: "#8A8270", fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>Loading manpower…</div>
      );

      if (summary.length === 0) return (
        <div style={{ border: "1px dashed #C9C2AC", borderRadius: 4, padding: 40, textAlign: "center", color: "#8A8270" }}>No manpower has been entered yet.</div>
      );

      return (
        <div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 18 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 40, fontWeight: 600, color: "#1F4E78" }}>{totals[0]}</div>
            <div style={{ fontSize: 13, color: "#5A5444" }}>on site now</div>
          </div>

          <div style={{ marginBottom: 24 }}>
            <div className="section-title">Manpower by Trade</div>
            <div style={{ background: "#FFFEFA", border: "1px solid #D8D2BF", borderRadius: 3, padding: "16px 16px 10px" }}>
              <GroupedBars series={series.length ? series : [{ name: "Total", values: totals }]} periods={periods} />
            </div>
          </div>

          <div style={{ overflowX: "auto", border: "1px solid #D8D2BF", borderRadius: 3 }}>
            <table className="roll-table">
              <thead>
                <tr>
                  <th>Trade</th>
                  {periods.map(p => <th key={p.key}>{p.short}</th>)}
                  <th>NET</th>
                </tr>
              </thead>
              <tbody>
                {activeTrades.map(t => {
                  const vals = periods.map(p => at(t.id, p.key));
                  const delta = vals[vals.length - 1] - vals[0];
                  return (
                    <tr key={t.id}>
                      <td>{t.name}</td>
                      {vals.map((v, i) => <td key={i}>{v}</td>)}
                      <td>{delta === 0 ? <span style={{ color: "#9A9381" }}>—</span> :
                        <span className={delta > 0 ? "pill-up" : "pill-down"}>{delta > 0 ? "+" : ""}{delta}</span>}</td>
                    </tr>
                  );
                })}
                <tr>
                  <td style={{ fontWeight: 600 }}>Total</td>
                  {totals.map((v, i) => <td key={i} style={{ fontWeight: 600 }}>{v}</td>)}
                  <td>{totals[totals.length - 1] - totals[0] === 0 ? <span style={{ color: "#9A9381" }}>—</span> :
                    <span className={totals[totals.length - 1] - totals[0] > 0 ? "pill-up" : "pill-down"}>
                      {totals[totals.length - 1] - totals[0] > 0 ? "+" : ""}{totals[totals.length - 1] - totals[0]}
                    </span>}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

            <Field label="Project name">
              <input className="cb-input" value={name} onChange={e => setName(e.target.value)} />
            </Field>
            <div style={{ fontSize: 12, color: "#7A7461", marginTop: 8, lineHeight: 1.5 }}>

            <div className="form-row-2" style={{ marginTop: 14 }}>
              <Field label="Start date"><input className="cb-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></Field>
              <Field label="End date"><input className="cb-input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></Field>

    // ── Manpower: full view ───────────────────────────────────────────────────

    function ManpowerView({ user, role, fullName, notify, onRequestSubmitted }) {
      const isOwner = isOwnerRole(role);
      const isAdmin = isManagerRole(role);

      const [projects, setProjects] = useState([]);
      const [trades, setTrades] = useState([]);
      const [assignments, setAssignments] = useState([]);
      const [rows, setRows] = useState([]);
      const [actuals, setActuals] = useState([]);
      const [comments, setComments] = useState([]);
      const [approvalRequired, setApprovalRequired] = useState(false);
      const [members, setMembers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [expanded, setExpanded] = useState(() => new Set());
      const [autoExpanded, setAutoExpanded] = useState(false);
      const [showDone, setShowDone] = useState(false);
      const [drafts, setDrafts] = useState({});
      const [addedTrades, setAddedTrades] = useState({});
      const [commentDraft, setCommentDraft] = useState({});
      const [saving, setSaving] = useState(false);
      const [showProjectModal, setShowProjectModal] = useState(false);
      const [editProject, setEditProject] = useState(null);
      const [deleteProject, setDeleteProject] = useState(null);
      const [confirmTrade, setConfirmTrade] = useState(null);
      const [askTrade, setAskTrade] = useState(false);
      const [newTradeName, setNewTradeName] = useState("");
      const [showAssign, setShowAssign] = useState(false);
      const [confirmDone, setConfirmDone] = useState(null);

      const periods = useMemo(() => computePeriods(), []);

      const load = useCallback(async () => {
        const [pRes, tRes, aRes, mRes, acRes, cRes, sRes] = await Promise.all([
          sb.from("projects").select("*").in("status", ["approved", "completed"]).order("name"),
          sb.from("trades").select("*").eq("status", "approved").order("name"),
          sb.from("project_assignments").select("*"),
          sb.from("manpower").select("*"),
          sb.from("manpower_actuals").select("*").order("recorded_on", { ascending: true }),
          sb.from("project_comments").select("*").order("created_at", { ascending: false }),
          sb.from("app_settings").select("*").eq("key", "manpower_approval_required").maybeSingle(),
        ]);
        setProjects(pRes.data || []);
        setTrades(tRes.data || []);
        setAssignments(aRes.data || []);
        setRows(mRes.data || []);
        setActuals(acRes.data || []);
        setComments(cRes.data || []);
        setApprovalRequired(sRes.data?.value === "true");
        if (isAdmin) {
          const { data: us } = await sb.from("user_roles").select("*").eq("status", "approved").order("full_name");
          setMembers((us || []).filter(u => !isManagerRole(u.role) && !isVisitorRole(u.role)));
        }
        setLoading(false);
      }, [isAdmin]);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        const ch = sb.channel("manpower-changes")
          .on("postgres_changes", { event: "*", schema: "public", table: "manpower" }, () => load())
          .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, () => load())
          .on("postgres_changes", { event: "*", schema: "public", table: "trades" }, () => load())
          .on("postgres_changes", { event: "*", schema: "public", table: "project_assignments" }, () => load())
          .on("postgres_changes", { event: "*", schema: "public", table: "project_comments" }, () => load())
          .on("postgres_changes", { event: "*", schema: "public", table: "app_settings" }, () => load())
          .subscribe();
        return () => { sb.removeChannel(ch); };
      }, [load]);

      const myProjectIds = useMemo(
        () => new Set(assignments.filter(a => a.user_id === user.id).map(a => a.project_id)),
        [assignments, user.id]
      );

      // A member lands on their own projects already open; everything else stays
      // collapsed. Runs once so it never fights a manual collapse.
      useEffect(() => {
        if (autoExpanded || loading || isAdmin) return;
        if (myProjectIds.size === 0) return;
        setExpanded(new Set(myProjectIds));
        setAutoExpanded(true);
      }, [myProjectIds, isAdmin, loading, autoExpanded]);

      const activeProjects = useMemo(() => projects.filter(p => p.status === "approved"), [projects]);
      const doneProjects   = useMemo(() => projects.filter(p => p.status === "completed"), [projects]);

      function toggleExpanded(id) {
        setExpanded(s => {
          const next = new Set(s);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      }

      // Mirrors can_write_manpower() in the database.
      function accessFor(proj) {
        if (proj.status === "completed") return "view";
        if (isAdmin) return "write";
        if (!myProjectIds.has(proj.id)) return "view";
        return approvalRequired ? "request" : "write";
      }
      const canComment = (projectId) => isAdmin || myProjectIds.has(projectId);
      // Mirrors projects_update: managers anywhere, assigned members while active.
      const canEditDetails = (proj) => isAdmin || (proj.status === "approved" && myProjectIds.has(proj.id));

      const cell = useCallback((projectId, tradeId, periodKey) => {
        return rows.find(x =>
          x.project_id === projectId &&
          (x.trade_id == null ? null : x.trade_id) === (tradeId == null ? null : tradeId) &&
          periodKeyOf(x) === periodKey) || null;
      }, [rows]);

      // A trade is "on" a project when a manpower row exists for it.
      const tradesOn = useCallback((projectId) => {
        const ids = new Set();
        rows.forEach(r => { if (r.project_id === projectId && r.trade_id != null) ids.add(r.trade_id); });
        (addedTrades[projectId] || []).forEach(id => ids.add(id));
        return trades.filter(t => ids.has(t.id));
      }, [rows, trades, addedTrades]);

      const activeTrades = useMemo(() => {
        const live = new Set(activeProjects.map(p => p.id));
        const ids = new Set();
        rows.forEach(r => { if (r.trade_id != null && live.has(r.project_id)) ids.add(r.trade_id); });
        return trades.filter(t => ids.has(t.id));
      }, [rows, trades, activeProjects]);

      const draftKey = (projectId, tradeId, periodKey) => `${projectId}|${tradeId}|${periodKey}`;

      function valueOf(projectId, tradeId, periodKey) {
        const k = draftKey(projectId, tradeId, periodKey);
        if (k in drafts) return drafts[k];
        const r = cell(projectId, tradeId, periodKey);
        return r ? String(r.headcount) : "";
      }
      function setValue(projectId, tradeId, periodKey, v) {
        if (!digitsOnly(v)) return;
        setDrafts(d => Object.assign({}, d, { [draftKey(projectId, tradeId, periodKey)]: v }));
      }

      // Total on a card is the sum of its trade lines. Projects that only ever
      // had a typed total, from before totals became derived, fall back to the
      // stored value so their history still reads correctly.
      function totalFor(projectId, periodKey) {
        const on = tradesOn(projectId);
        if (on.length === 0) {
          const stored = cell(projectId, null, periodKey);
          return stored ? stored.headcount : 0;
        }
        return on.reduce((s, t) => s + numOf(valueOf(projectId, t.id, periodKey)), 0);
      }

      const projectDirty = (projectId) =>
        Object.keys(drafts).some(k => k.indexOf(projectId + "|") === 0) ||
        (addedTrades[projectId] || []).length > 0;

      function lastUpdatedFor(projectId) {
        const mine = rows.filter(r => r.project_id === projectId && r.updated_at).map(r => r.updated_at);
        if (mine.length === 0) return null;
        return mine.sort()[mine.length - 1];
      }

      function clearDrafts(projectId) {
        setDrafts(d => {
          const next = Object.assign({}, d);
          Object.keys(next).forEach(k => { if (k.indexOf(projectId + "|") === 0) delete next[k]; });
          return next;
        });
        setAddedTrades(a => Object.assign({}, a, { [projectId]: [] }));
      }

      function addTradeToProject(projectId, tradeId) {
        setAddedTrades(a => Object.assign({}, a, { [projectId]: (a[projectId] || []).concat([tradeId]) }));
        periods.forEach(p => {
          const k = draftKey(projectId, tradeId, p.key);
          setDrafts(d => (k in d) ? d : Object.assign({}, d, { [k]: "0" }));
        });
      }

      // Removing a trade deletes its live rows for this project. The forecast
      // snapshots and the actuals log are separate append-only tables, so the
      // history survives even though the line disappears. The database trigger
      // recalculates the project total as the rows go.
      async function removeTradeFromProject(projectId, tradeId) {
        const savedRows = rows.some(r => r.project_id === projectId && r.trade_id === tradeId);
        setConfirmTrade(null);

        setAddedTrades(a => Object.assign({}, a, {
          [projectId]: (a[projectId] || []).filter(id => id !== tradeId),
        }));
        setDrafts(d => {
          const next = Object.assign({}, d);
          periods.forEach(p => { delete next[draftKey(projectId, tradeId, p.key)]; });
          return next;
        });

        if (!savedRows) { notify("Trade removed"); return; }

        setSaving(true);
        const { error } = await sb.from("manpower").delete().eq("project_id", projectId).eq("trade_id", tradeId);
        setSaving(false);
        if (error) { notify("Could not remove the trade: " + error.message, "error"); return; }
        notify("Trade removed");
        load();
      }

      // ── Save ────────────────────────────────────────────────────────────────

      function collectCells(projectId) {
        const out = [];
        tradesOn(projectId).forEach(t => {
          periods.forEach(p => {
            const k = draftKey(projectId, t.id, p.key);
            if (!(k in drafts)) return;
            out.push({
              project_id: projectId, trade_id: t.id, period_date: p.date,
              headcount: numOf(drafts[k]), existing: cell(projectId, t.id, p.key),
            });
          });
        });
        return out;
      }

      async function saveProject(projectId) {
        const cells = collectCells(projectId);
        if (cells.length === 0) return;
        setSaving(true);

        const updates = cells.filter(c => c.existing).map(c => ({
          id: c.existing.id, project_id: c.project_id, trade_id: c.trade_id,
          period_date: c.period_date, headcount: c.headcount,
        }));
        const inserts = cells.filter(c => !c.existing).map(c => ({
          project_id: c.project_id, trade_id: c.trade_id,
          period_date: c.period_date, headcount: c.headcount,
        }));

        let err = null;
        if (updates.length) {
          const { error } = await sb.from("manpower").upsert(updates);
          if (error) err = error;
        }
        if (!err && inserts.length) {
          const { error } = await sb.from("manpower").insert(inserts);
          if (error) err = error;
        }
        setSaving(false);
        if (err) { notify("Save failed: " + err.message, "error"); return; }
        clearDrafts(projectId);
        notify("Manpower updated");
        load();
      }

      function buildPayloadRows(projectId) {
        return tradesOn(projectId).map(t => ({
          label: t.name, trade_id: t.id,
          values: periods.reduce((o, p) => { o[p.key] = numOf(valueOf(projectId, t.id, p.key)); return o; }, {}),
        }));
      }

      async function submitProjectRequest(projectId) {
        const project = projects.find(p => p.id === projectId);
        setSaving(true);
        const { error } = await sb.from("requests").insert({
          kind: "manpower", action: "edit", status: "pending",
          requester_id: user.id, requester_email: user.email, requester_full_name: fullName || null,
          payload: JSON.stringify({
            project_id: projectId, project_name: project ? project.name : "",
            periods: periods.map(p => ({ key: p.key, date: p.date, label: p.label, short: p.short })),
            rows: buildPayloadRows(projectId),
          }),
        });
        setSaving(false);
        if (error) { notify("Request failed: " + error.message, "error"); return; }
        clearDrafts(projectId);
        notify("Manpower submitted for approval");
        if (onRequestSubmitted) onRequestSubmitted();
      }

      async function submitNewProject(name, startDate, endDate, gridRows) {
        setSaving(true);
        const { error } = await sb.from("requests").insert({
          kind: "project", action: "add", status: "pending",
          requester_id: user.id, requester_email: user.email, requester_full_name: fullName || null,
          payload: JSON.stringify({
            name, start_date: startDate, end_date: endDate,
            periods: periods.map(p => ({ key: p.key, date: p.date, label: p.label, short: p.short })),
            rows: gridRows,
          }),
        });
        setSaving(false);
        if (error) { notify("Request failed: " + error.message, "error"); return; }
        setShowProjectModal(false);
        notify("New project submitted for approval");
        if (onRequestSubmitted) onRequestSubmitted();
      }

      async function submitNewTrade() {
        const name = newTradeName.trim();
        if (!name) return;
        setSaving(true);
        const { error } = await sb.from("requests").insert({
          kind: "trade", action: "add", status: "pending",
          requester_id: user.id, requester_email: user.email, requester_full_name: fullName || null,
          payload: JSON.stringify({ name }),
        });
        setSaving(false);
        if (error) { notify("Request failed: " + error.message, "error"); return; }
        setAskTrade(false); setNewTradeName("");
        notify("New trade submitted for approval");
        if (onRequestSubmitted) onRequestSubmitted();
      }

      async function saveProjectDetails(patch) {
        setSaving(true);
        const { error } = await sb.from("projects").update(patch).eq("id", editProject.id);
        setSaving(false);
        if (error) {
          notify(error.code === "23505"
            ? `A project named "${patch.name}" already exists.`
            : "Could not save: " + error.message, "error");
          return;
        }
        setEditProject(null);
        notify("Project updated");
        load();
      }

      async function setProjectStatus(proj, status) {
        const patch = { status, completed_at: status === "completed" ? new Date().toISOString() : null };
        const { error } = await sb.from("projects").update(patch).eq("id", proj.id);
        setConfirmDone(null);
        if (error) { notify("Could not update the project: " + error.message, "error"); return; }
        notify(status === "completed" ? `${proj.name} marked complete` : `${proj.name} reopened`);
        load();
      }

      async function removeProject() {
        setSaving(true);
        const { error } = await sb.from("projects").delete().eq("id", deleteProject.id);
        setSaving(false);
        if (error) { notify("Delete failed: " + error.message, "error"); return; }
        const name = deleteProject.name;
        setDeleteProject(null);
        notify(`${name} deleted`);
        load();
      }

      async function postComment(projectId) {
        const body = (commentDraft[projectId] || "").trim();
        if (!body) return;
        setSaving(true);
        const { error } = await sb.from("project_comments").insert({
          project_id: projectId, user_id: user.id, author_name: fullName || user.email, body,
        });
        setSaving(false);
        if (error) { notify("Comment failed: " + error.message, "error"); return; }
        setCommentDraft(d => Object.assign({}, d, { [projectId]: "" }));
        load();
      }

      async function deleteComment(c) {
        const { error } = await sb.from("project_comments").delete().eq("id", c.id);
        if (error) { notify("Delete failed: " + error.message, "error"); return; }
        notify("Comment deleted");
        load();
      }

      async function toggleApproval() {
        const next = approvalRequired ? "false" : "true";
        const { error } = await sb.from("app_settings")
          .update({ value: next, updated_by: user.id, updated_at: new Date().toISOString() })
          .eq("key", "manpower_approval_required");
        if (error) { notify("Could not change the setting: " + error.message, "error"); return; }
        setApprovalRequired(next === "true");
        notify(next === "true" ? "Approvals now required" : "Approvals turned off");
      }

      async function toggleAssignment(userId, projectId, on) {
        if (on) {
          const { error } = await sb.from("project_assignments").insert({ user_id: userId, project_id: projectId, assigned_by: user.id });
          if (error) { notify("Assign failed: " + error.message, "error"); return; }
        } else {
          const { error } = await sb.from("project_assignments").delete().eq("user_id", userId).eq("project_id", projectId);
          if (error) { notify("Unassign failed: " + error.message, "error"); return; }
        }
        load();
      }

      // ── Rollup and analytics — active projects only ─────────────────────────

      const rollup = useMemo(() => {
        const byTrade = {}, byProject = {}, totals = {};
        activeTrades.forEach(t => { byTrade[t.id] = {}; periods.forEach(p => { byTrade[t.id][p.key] = 0; }); });
        periods.forEach(p => { totals[p.key] = 0; });

        activeProjects.forEach(proj => {
          byProject[proj.id] = {};
          activeTrades.forEach(t => { byProject[proj.id][t.id] = {}; });
          periods.forEach(p => {
            let detailed = 0;
            activeTrades.forEach(t => {
              const c = cell(proj.id, t.id, p.key);
              const v = c ? c.headcount : 0;
              byProject[proj.id][t.id][p.key] = v;
              byTrade[t.id][p.key] += v;
              detailed += v;
            });
            const storedTotal = cell(proj.id, null, p.key);
            totals[p.key] += Math.max(detailed, storedTotal ? storedTotal.headcount : 0);
          });
        });
        return { byTrade, byProject, totals };
      }, [activeProjects, activeTrades, periods, cell]);

      // Each period is compared against the PREVIOUS period, not against today.
      // Comparing everything to today double-counts: a hire made in month one
      // would still read as an outstanding need in month two.
      const moves = useMemo(() => {
        const out = [];
        for (let i = 1; i < periods.length; i++) {
          const prev = periods[i - 1], p = periods[i];
          activeTrades.forEach(t => {
            const releasing = [], needing = [];
            activeProjects.forEach(proj => {
              const tr = rollup.byProject[proj.id] ? rollup.byProject[proj.id][t.id] : null;
              if (!tr) return;
              const delta = (tr[p.key] || 0) - (tr[prev.key] || 0);
              if (delta < 0) releasing.push({ name: proj.name, count: -delta });
              if (delta > 0) needing.push({ name: proj.name, count: delta });
            });
            if (releasing.length === 0 && needing.length === 0) return;

            const totalRel = releasing.reduce((s, r) => s + r.count, 0);
            const totalNeed = needing.reduce((s, r) => s + r.count, 0);

            const pool = releasing.map(r => Object.assign({}, r)).sort((a, b) => b.count - a.count);
            const want = needing.map(r => Object.assign({}, r)).sort((a, b) => b.count - a.count);
            const transfers = [];
            pool.forEach(src => {
              want.forEach(dst => {
                if (src.count === 0 || dst.count === 0) return;
                const n = Math.min(src.count, dst.count);
                transfers.push({ from: src.name, to: dst.name, count: n });
                src.count -= n; dst.count -= n;
              });
            });

            out.push({
              period: p, from: prev, trade: t, totalRel, totalNeed, transfers, releasing,
              hire: Math.max(0, totalNeed - totalRel),
              surplus: Math.max(0, totalRel - totalNeed),
            });
          });
        }
        return out;
      }, [activeProjects, activeTrades, periods, rollup]);

      const chartSeries = useMemo(() => {
        if (activeTrades.length === 0) return [{ name: "Total", values: periods.map(p => rollup.totals[p.key] || 0) }];
        return activeTrades.map(t => ({ name: t.name, values: periods.map(p => (rollup.byTrade[t.id] || {})[p.key] || 0) }));
      }, [activeTrades, periods, rollup]);

      const tradeModal = askTrade && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setAskTrade(false)}>
          <div className="modal-box" style={{ maxWidth: 400 }}>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 18, textTransform: "uppercase", marginBottom: 14 }}>Request new trade</div>
            <Field label="Trade name">
              <input className="cb-input" value={newTradeName} onChange={e => setNewTradeName(e.target.value)}
                placeholder="e.g. Pipefitters" onKeyDown={e => e.key === "Enter" && submitNewTrade()} />
            </Field>
            <div style={{ fontSize: 12, color: "#7A7461", marginTop: 10, lineHeight: 1.5 }}>
              Once approved this becomes selectable on any project. An Admin can correct the
              spelling before approving.
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 18 }}>
              <button className="cb-btn-ghost" onClick={() => setAskTrade(false)}>Cancel</button>
              <button className="cb-btn" disabled={!newTradeName.trim() || saving} onClick={submitNewTrade}>{saving ? "Submitting…" : "Submit"}</button>
            </div>
          </div>
        </div>
      );

      // ── Project card ────────────────────────────────────────────────────────

      function renderProject(proj) {
        const done = proj.status === "completed";
        const access = accessFor(proj);
        const open = expanded.has(proj.id);
        const editable = access === "write" || access === "request";
        const dirty = projectDirty(proj.id);
        const updated = lastUpdatedFor(proj.id);
        const staleDays = daysSince(updated);
        const projActuals = actuals.filter(a => a.project_id === proj.id && a.trade_id === null);
        const forecast = periods.reduce((o, p) => { o[p.key] = totalFor(proj.id, p.key); return o; }, {});
        const onProject = tradesOn(proj.id);
        const available = trades.filter(t => onProject.every(x => x.id !== t.id));
        const projComments = comments.filter(c => c.project_id === proj.id);
        const headPeriods = periods.slice(0, 3);

        return (
          <div key={proj.id} className={"mp-card" + (done ? " done" : "")}>
            <div className="mp-card-head" onClick={() => toggleExpanded(proj.id)}>
              <div style={{ minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 600, fontSize: 15 }}>{proj.name}</span>
                  {done && <span className="status-chip" style={{ color: "#5A5444", background: "#EDE9DC", borderColor: "#C9C2AC" }}>COMPLETE</span>}
                  {!done && myProjectIds.has(proj.id) && !isAdmin && <span className="status-chip" style={{ color: "#1F4E78", background: "#E1E9F0", borderColor: "#2E6394" }}>YOURS</span>}
                </div>
                <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", marginTop: 3,
                  color: staleDays === null ? "#9A9381" : staleDays > 14 && !done ? "#9A3C3C" : "#8A8270" }}>
                  {(proj.start_date || proj.end_date) && (fmt(proj.start_date) + " – " + fmt(proj.end_date) + " · ")}
                  {staleDays === null ? "NEVER UPDATED" : staleDays === 0 ? "UPDATED TODAY" : `UPDATED ${staleDays}D AGO`}
                  {access === "request" && " · SUBMITS FOR APPROVAL"}
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                {headPeriods.map(p => (
                  <div key={p.key} style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 17, fontWeight: 600, color: "#1B2A33" }}>{totalFor(proj.id, p.key)}</div>
                    <div style={{ fontSize: 9, fontFamily: "'JetBrains Mono', monospace", color: "#9A9381" }}>{p.short}</div>
                  </div>
                ))}
                <span style={{ fontSize: 11, color: "#9A9381", fontFamily: "'JetBrains Mono', monospace" }}>{open ? "▲" : "▼"}</span>
              </div>
            </div>

            {open && (
              <div className="mp-card-body">
                <div style={{ overflowX: "auto" }}>
                  <table className="mp-grid">
                    <thead>
                      <tr>
                        <th>Trade</th>
                        {periods.map(p => <th key={p.key}>{p.short}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {onProject.length === 0 && (
                        <tr><td colSpan={periods.length + 1} style={{ fontSize: 12, color: "#8A8270", padding: "10px 6px" }}>
                          No trades on this project yet.{editable ? " Add one below to start tracking." : ""}
                        </td></tr>
                      )}
                      {onProject.map(t => (
                        <tr key={t.id}>
                          <td>
                            {t.name}
                            {editable && (
                              <button className="trade-x" title={"Remove " + t.name}
                                onClick={() => setConfirmTrade({ project: proj, trade: t })}>×</button>
                            )}
                          </td>
                          {periods.map(p => (
                            <td key={p.key}>
                              <input className="mp-num" inputMode="numeric" disabled={!editable}
                                value={valueOf(proj.id, t.id, p.key)}
                                onChange={e => setValue(proj.id, t.id, p.key, e.target.value)}
                                placeholder="0" />
                            </td>
                          ))}
                        </tr>
                      ))}
                      <tr className="total-row">
                        <td>Total</td>
                        {periods.map(p => <td key={p.key}><span className="mp-readonly">{totalFor(proj.id, p.key)}</span></td>)}
                      </tr>
                    </tbody>
                  </table>
                </div>

                {editable && available.length > 0 && (
                  <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#8A8270" }}>ADD TRADE</span>
                    {available.map(t => (
                      <button key={t.id} className="trade-toggle" onClick={() => addTradeToProject(proj.id, t.id)}
                        style={{ background: "#FFFEFA", color: "#5A5444", border: "1px solid #C9C2AC" }}>+ {t.name}</button>
                    ))}
                  </div>
                )}

                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 14, flexWrap: "wrap" }}>
                  {isAdmin && <button className="cb-btn-danger" style={{ fontSize: 13, padding: "9px 14px" }} onClick={() => setDeleteProject(proj)}>Delete</button>}
                  {canEditDetails(proj) && <button className="cb-btn-ghost" style={{ fontSize: 13, padding: "9px 14px" }} onClick={() => setEditProject(proj)}>Edit details</button>}
                  {isAdmin && !done && <button className="cb-btn-ghost" style={{ fontSize: 13, padding: "9px 14px" }} onClick={() => setConfirmDone(proj)}>Mark complete</button>}
                  {isAdmin && done && <button className="cb-btn-ghost" style={{ fontSize: 13, padding: "9px 14px" }} onClick={() => setProjectStatus(proj, "approved")}>Reopen</button>}
                  {editable && dirty && <button className="cb-btn-ghost" style={{ fontSize: 13, padding: "9px 14px" }} onClick={() => clearDrafts(proj.id)}>Discard</button>}
                  {editable && (
                    <button className="cb-btn" style={{ fontSize: 13, padding: "9px 16px" }} disabled={!dirty || saving}
                      onClick={() => access === "request" ? submitProjectRequest(proj.id) : saveProject(proj.id)}>
                      {saving ? "Saving…" : access === "request" ? "Submit for approval" : "Save"}
                    </button>
                  )}
                </div>

                <div style={{ marginTop: 18, borderTop: "1px solid #EDE9DC", paddingTop: 14 }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#8A8270", marginBottom: 8 }}>HEADCOUNT OVER TIME</div>
                  <ProjectTrendChart actuals={projActuals} forecast={forecast} periods={periods} />
                </div>

                <div style={{ marginTop: 18, borderTop: "1px solid #EDE9DC", paddingTop: 14 }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#8A8270", marginBottom: 8 }}>
                    COMMENTS{projComments.length > 0 ? ` (${projComments.length})` : ""}
                  </div>
                  {canComment(proj.id) && (
