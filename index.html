<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew Board</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; background: #F7F4EC; background-image: linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px); background-size: 28px 28px; }
    .cb-input, .cb-textarea {
      font-family: 'Inter', sans-serif; font-size: 14px;
      border: 1px solid #C9C2AC; background: #FFFEFA; color: #1B2A33;
      border-radius: 3px; padding: 10px 12px; width: 100%; -webkit-appearance: none;
    }
    .cb-input:focus, .cb-textarea:focus { outline: 2px solid #1F4E78; outline-offset: 1px; }
    .cb-btn {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      border-radius: 3px; border: 1px solid #1B2A33; background: #1B2A33;
      color: #F7F4EC; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn:hover { background: #2A3F4C; }
    .cb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cb-btn-ghost {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      background: transparent; color: #1B2A33; border: 1px solid #B9B3A0;
      border-radius: 3px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn-ghost:hover { background: #EDE9DC; }
    .cb-btn-danger {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      background: transparent; color: #9A3C3C; border: 1px solid #C98787;
      border-radius: 3px; padding: 11px 18px; cursor: pointer; white-space: nowrap;
    }
    .cb-btn-danger:hover { background: #F6E8E8; }
    .cb-btn-approve {
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
      background: #3E6F5C; color: #fff; border: 1px solid #3E6F5C;
      border-radius: 3px; padding: 8px 14px; cursor: pointer;
    }
    .cb-btn-approve:hover { background: #2E5243; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(27,42,51,0.55);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 100; padding: 16px; overflow-y: auto;
    }
    .modal-box {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-radius: 6px;
      padding: 24px; width: 100%; max-width: 480px; margin: auto;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1B2A33; color: #F7F4EC; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; padding: 10px 18px; border-radius: 4px; z-index: 200;
      max-width: 90vw; text-align: center; animation: fadeIn 0.2s ease;
    }
    .toast.error { background: #7A3B3B; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(6px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
    .roster-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-radius: 3px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    }
    @media (min-width: 700px) {
      .roster-card { display: grid; grid-template-columns: 1.3fr 1.4fr auto auto; gap: 16px; align-items: center; }
    }
    .card-actions { display: flex; gap: 8px; }
    .card-actions button { flex: 1; }
    @media (min-width: 700px) { .card-actions button { flex: unset; } }
    .form-row-2 { display: grid; grid-template-columns: 1fr; gap: 13px; }
    @media (min-width: 480px) { .form-row-2 { grid-template-columns: 1fr 1fr; } }
    .search-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .search-bar input { flex: 1; min-width: 160px; }
    .board-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 16px; gap: 12px;
    }
    .req-row {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #C9821F;
      padding: 12px 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .req-row:hover { background: #FDF6EC; }
    .req-detail {
      border: 1px solid #D8D2BF; border-top: none; border-left: 4px solid #C9821F;
      border-radius: 0 0 3px 3px; background: #FFFEFA; padding: 14px 16px;
    }
    .note-bar {
      font-size: 12px; color: #6B6354; background: #EFEBDD; border: 1px solid #D8D2BF;
      border-radius: 3px; padding: 8px 12px; margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px;
      text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
    }
    /* Tabs */
    .tab-strip { display: flex; gap: 2px; border-bottom: 2px solid #1B2A33; margin-bottom: 20px; }
    .tab-btn {
      font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px;
      letter-spacing: 0.05em; text-transform: uppercase;
      background: transparent; border: 1px solid transparent; border-bottom: none;
      color: #8A8270; padding: 10px 20px; cursor: pointer; border-radius: 3px 3px 0 0;
      margin-bottom: -2px;
    }
    .tab-btn:hover { color: #1B2A33; background: #EDE9DC; }
    .tab-btn.active { background: #1B2A33; color: #F7F4EC; border-color: #1B2A33; }
    /* Manpower */
    .mp-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #1F4E78;
      border-radius: 3px; margin-bottom: 10px;
    }
    .mp-card-head {
      padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; cursor: pointer; flex-wrap: wrap;
    }
    .mp-card-head:hover { background: #FBF9F2; }
    .mp-card-body { border-top: 1px solid #E3DFD1; padding: 14px 16px; }
    .mp-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mp-grid th {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.06em; color: #8A8270; text-align: right; padding: 0 6px 7px;
      white-space: nowrap;
    }
    .mp-grid th:first-child { text-align: left; }
    .mp-grid td { padding: 4px 6px; border-top: 1px solid #EDE9DC; text-align: right; }
    .mp-grid td:first-child { text-align: left; color: #5A5444; }
    .mp-num {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; width: 68px;
      border: 1px solid #C9C2AC; background: #FFFEFA; color: #1B2A33;
      border-radius: 3px; padding: 6px 8px; text-align: right; -webkit-appearance: none;
    }
    .mp-num:focus { outline: 2px solid #1F4E78; outline-offset: 1px; }
    .mp-num:disabled { background: #F2EFE4; color: #8A8270; }
    .mp-readonly { font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 6px 8px; display: inline-block; }
    .roll-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #FFFEFA; }
    .roll-table th {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
      color: #8A8270; text-align: right; padding: 9px 10px; border-bottom: 1px solid #D8D2BF;
      white-space: nowrap;
    }
    .roll-table th:first-child { text-align: left; }
    .roll-table td { padding: 9px 10px; border-bottom: 1px solid #EDE9DC; text-align: right; font-family: 'JetBrains Mono', monospace; }
    .roll-table td:first-child { text-align: left; font-family: 'Inter', sans-serif; }
    .pill-up { color: #9A3C3C; background: #F6E8E8; border: 1px solid #C98787; border-radius: 3px; padding: 1px 6px; font-size: 11px; }
    .pill-down { color: #3E6F5C; background: #E4EEE7; border: 1px solid #8DB3A2; border-radius: 3px; padding: 1px 6px; font-size: 11px; }
    .move-card {
      background: #FFFEFA; border: 1px solid #D8D2BF; border-left: 4px solid #3E6F5C;
      border-radius: 3px; padding: 12px 16px; margin-bottom: 8px; font-size: 13px;
    }
    .move-card.hire { border-left-color: #C9821F; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    const SUPABASE_URL = "https://omlgxlecijdvczbnteai.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tbGd4bGVjaWpkdmN6Ym50ZWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDk1NjMsImV4cCI6MjA5ODQyNTU2M30.SODHGjbOaixxfdLIdDMMqSxkdI3GgjK8Tlrz9d8zU6I";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Roles that count as board managers. Kept in one place so the UI and the
    // database RLS policies stay in agreement.
    const MANAGER_ROLES = ["admin", "owner", "hidden_admin", "hidden_owner"];
    const isManagerRole = (r) => MANAGER_ROLES.includes(r);
    const isOwnerRole = (r) => r === "owner" || r === "hidden_owner";

    const OWNER_EMAIL = "goldytraju@gmail.com";

    // NOTE: this is a stub. Browser-side code cannot send mail. Wiring this up
    // requires a Supabase Edge Function with a mail provider key. Until then,
    // no access-request or approval notifications are actually delivered.
    // (Supabase Auth password-reset mail is separate and does work.)
    async function sendEmail(to, subject, html) {
      console.log("Email notification (not sent — server-side function needed):", { to, subject });
    }

    // ── Date helpers ──────────────────────────────────────────────────────────

    function isoDate(d) {
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function endOfMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0);
    }

    function monthLabel(d) {
      return d.toLocaleDateString("en-CA", { month: "long" });
    }

    // Two forecast buckets: end of this month and end of next.
    // When fewer than 7 days remain in the current month the window rolls
    // forward, so nobody is ever asked to forecast two days out.
    const ROLLOVER_DAYS = 7;

    function computePeriods(today = new Date()) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const thisMonthEnd = endOfMonth(t.getFullYear(), t.getMonth());
      const daysLeft = Math.round((thisMonthEnd - t) / 86400000);
      const shift = daysLeft < ROLLOVER_DAYS ? 1 : 0;
      const p1 = endOfMonth(t.getFullYear(), t.getMonth() + shift);
      const p2 = endOfMonth(t.getFullYear(), t.getMonth() + shift + 1);
      return [
        { key: "now", date: null, label: "On site now", short: "NOW" },
        { key: isoDate(p1), date: isoDate(p1), label: "End of " + monthLabel(p1), short: monthLabel(p1).slice(0, 3).toUpperCase() },
        { key: isoDate(p2), date: isoDate(p2), label: "End of " + monthLabel(p2), short: monthLabel(p2).slice(0, 3).toUpperCase() },
      ];
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      return Math.round((new Date(dateStr + "T00:00:00") - today) / 86400000);
    }

    function daysSince(tsStr) {
      if (!tsStr) return null;
      return Math.floor((new Date() - new Date(tsStr)) / 86400000);
    }

    function deriveStatus(p) {
      const onVacation = p.vacation_start && p.vacation_end &&
        new Date() >= new Date(p.vacation_start + "T00:00:00") &&
        new Date() <= new Date(p.vacation_end + "T23:59:59");
      if (onVacation) return "vacation";
      if (!p.current_project || p.current_project.toLowerCase() === "unassigned") return "available";
      const du = daysUntil(p.project_end);
      if (du !== null && du <= 14) return "transitioning";
      return "active";
    }

    const STATUS_META = {
      active:        { label: "On project",  stamp: "ACTIVE",     color: "#3E6F5C", bg: "#E4EEE7", border: "#3E6F5C" },
      transitioning: { label: "Wrapping up", stamp: "TRANSITION", color: "#A4621A", bg: "#F6E9D6", border: "#C9821F" },
      available:     { label: "Available",   stamp: "AVAILABLE",  color: "#1F4E78", bg: "#E1E9F0", border: "#2E6394" },
      vacation:      { label: "On vacation", stamp: "ON LEAVE",   color: "#7A3B3B", bg: "#F2E1E1", border: "#A14E4E" },
    };

    function fmt(d) {
      if (!d) return "—";
      return new Date(d + "T00:00:00").toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
    }

    // ── Shared inputs ─────────────────────────────────────────────────────────

    function PasswordField({ label, value, onChange, placeholder, onKeyDown }) {
      const [show, setShow] = React.useState(false);
      const [capsOn, setCapsOn] = React.useState(false);
      return (
        <label style={{ display: "block" }}>
          <div style={{ fontSize: 11, color: "#7A7461", marginBottom: 5, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em" }}>
            {label.toUpperCase()}
          </div>
          <div style={{ position: "relative" }}>
            <input className="cb-input" type={show ? "text" : "password"} value={value} onChange={onChange}
              placeholder={placeholder || "••••••••"} onKeyDown={onKeyDown}
              onKeyUp={e => setCapsOn(e.getModifierState("CapsLock"))}
              onFocus={e => setCapsOn(e.getModifierState("CapsLock"))}
              style={{ paddingRight: 40 }} />
            <button type="button" onClick={() => setShow(!show)} style={{
              position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)",
              background: "none", border: "none", cursor: "pointer", fontSize: 15, color: "#8A8270", padding: 0,
            }}>{show ? "🙈" : "👁"}</button>
          </div>
          {capsOn && <div style={{ fontSize: 11, color: "#A4621A", marginTop: 4 }}>⚠ Caps Lock is on</div>}
        </label>
      );
    }

    function Field({ label, children }) {
      return (
        <label style={{ display: "block" }}>
          <div style={{ fontSize: 11, color: "#7A7461", marginBottom: 5, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.04em" }}>
            {label.toUpperCase()}
          </div>
          {children}
        </label>
      );
    }

    function Toast({ message, type, onDone }) {
      useEffect(() => { const t = setTimeout(onDone, type === "error" ? 5000 : 2800); return () => clearTimeout(t); }, []);
      return <div className={`toast${type === "error" ? " error" : ""}`}>{message}</div>;
    }

    // ── Login Screen ──────────────────────────────────────────────────────────
    function LoginScreen({ onSwitchToSignup }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [view, setView] = useState("login");

      async function handleLogin() {
        setLoading(true); setMessage(null);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { setMessage({ text: error.message, type: "error" }); setLoading(false); }
      }

      async function handleForgot() {
        if (!email) { setMessage({ text: "Enter your email address above first.", type: "error" }); return; }
        setLoading(true); setMessage(null);
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: "https://goldytr.github.io/crew-board/",
        });
        if (error) { setMessage({ text: error.message, type: "error" }); }
        else { setMessage({ text: "Password reset email sent — check your inbox.", type: "ok" }); setView("login"); }
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: "#F7F4EC", backgroundImage: "linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px)", backgroundSize: "28px 28px", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#FFFEFA", border: "1px solid #D8D2BF", borderRadius: 6, padding: 32, width: "100%", maxWidth: 380 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6B6354", marginBottom: 4 }}>REGISTER — CREW DEPLOYMENT</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, textTransform: "uppercase", marginBottom: 24 }}>Crew Board</h1>
            {view === "login" ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <Field label="Email"><input className="cb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" /></Field>
                <PasswordField label="Password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleLogin()} />
                {message && <div style={{ fontSize: 12, color: message.type === "ok" ? "#3E6F5C" : "#9A3C3C", background: message.type === "ok" ? "#E4EEE7" : "#F6E8E8", padding: "8px 12px", borderRadius: 3 }}>{message.text}</div>}
                <button className="cb-btn" disabled={!email || !password || loading} onClick={handleLogin}>{loading ? "Signing in…" : "Sign in"}</button>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                  <button onClick={() => { setView("forgot"); setMessage(null); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#6B6354", textDecoration: "underline", fontFamily: "'Inter', sans-serif" }}>Forgot password?</button>
                  <button onClick={onSwitchToSignup} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#1F4E78", textDecoration: "underline", fontFamily: "'Inter', sans-serif", fontWeight: 600 }}>Request access →</button>
                </div>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 13, color: "#5A5444", marginBottom: 4 }}>Enter your email and we will send you a link to reset your password.</div>
                <Field label="Email"><input className="cb-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" /></Field>
                {message && <div style={{ fontSize: 12, color: message.type === "ok" ? "#3E6F5C" : "#9A3C3C", background: message.type === "ok" ? "#E4EEE7" : "#F6E8E8", padding: "8px 12px", borderRadius: 3 }}>{message.text}</div>}
                <button className="cb-btn" disabled={!email || loading} onClick={handleForgot}>{loading ? "Sending…" : "Send reset email"}</button>
                <button onClick={() => { setView("login"); setMessage(null); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#6B6354", textDecoration: "underline", fontFamily: "'Inter', sans-serif", textAlign: "center" }}>← Back to sign in</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Sign Up Screen ────────────────────────────────────────────────────────
    function SignupScreen({ onSwitchToLogin }) {
      const [firstName, setFirstName] = useState("");
      const [lastName, setLastName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);

      async function handleSignup() {
        if (password !== confirm) { setMessage({ text: "Passwords do not match.", type: "error" }); return; }
        if (password.length < 6) { setMessage({ text: "Password must be at least 6 characters.", type: "error" }); return; }
        if (!firstName.trim() || !lastName.trim()) { setMessage({ text: "Please enter your full name.", type: "error" }); return; }
        setLoading(true); setMessage(null);
        const fullName = `${firstName.trim()} ${lastName.trim()}`;
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { setMessage({ text: error.message, type: "error" }); setLoading(false); return; }
        if (data?.user) {
          // role and status are also pinned by the database insert policy —
          // these values must stay 'member' / 'pending' or the insert is rejected.
          const { error: roleErr } = await sb.from("user_roles").insert({
            user_id: data.user.id, email: data.user.email, full_name: fullName,
            role: "member", status: "pending",
          });
          if (roleErr) {
            setMessage({ text: "Account created, but the access request failed to register: " + roleErr.message + " — please contact your manager.", type: "error" });
            setLoading(false); return;
          }
          await sendEmail(OWNER_EMAIL, "New Access Request — Crew Board", `<p><strong>${fullName}</strong> (${email}) has requested access to the Crew Board.</p><p><a href="https://goldytr.github.io/crew-board/">Log in to approve or reject</a></p>`);
        }
        setMessage({ text: "Request submitted — an Admin will approve your access shortly.", type: "ok" });
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: "#F7F4EC", backgroundImage: "linear-gradient(#E3DFD1 1px, transparent 1px), linear-gradient(90deg, #E3DFD1 1px, transparent 1px)", backgroundSize: "28px 28px", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: "#FFFEFA", border: "1px solid #D8D2BF", borderRadius: 6, padding: 32, width: "100%", maxWidth: 420 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6B6354", marginBottom: 4 }}>REGISTER — CREW DEPLOYMENT</div>
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 26, textTransform: "uppercase", marginBottom: 6 }}>Request Access</h1>
            <div style={{ fontSize: 13, color: "#6B6354", marginBottom: 20 }}>Fill in your details below. An Admin will review and approve your request.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div className="form-row-2">
